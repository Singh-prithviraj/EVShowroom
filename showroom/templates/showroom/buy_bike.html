{% extends 'showroom/base.html' %}
{% block content %}

<section class="buy-section py-5 text-light">
  <div class="container">

    <!-- Header -->
    <div class="text-center mb-5">
      <h1 class="about-title fw-bold">Purchase Your EV Bike</h1>
      <p class="text-muted mt-2">Secure, fast & seamless purchase process</p>
    </div>

    <div class="row align-items-start g-4">

      <!-- Bike Details -->
      <div class="col-md-6 text-center">
        <img src="{{ bike.image.url }}" class="img-fluid rounded shadow-lg bike-image" alt="{{ bike.name }}">
        
        <h2 class="mt-4 fw-bold bike-title">
          {{ bike.brand }} - {{ bike.name }}
        </h2>

        <p class="lead text-muted">
          Price: ₹{{ bike.price }}
        </p>
      </div>

      <!-- Purchase Form -->
      <div class="col-md-6">
        <div class="card purchase-card p-4">
          <h4 class="text-center mb-3 fw-semibold text-light">
            Complete Your Purchase
          </h4>

          <form method="POST">
            {% csrf_token %}
            <div class="form-fields text-muted">
              {{ form.as_p }}
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3 py-2">
              Buy Now
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>
</section>

<style>
/* Match About Page Background */
.buy-section {
  background: linear-gradient(135deg, #0c1116, #05070a);
}



/* Titles */
.about-title,
.bike-title {
  color: #00e6b8;
}

/* Image Styling */
.bike-image {
  border-radius: 12px;
  transition: .4s ease;
}
.bike-image:hover {
  transform: scale(1.03);
}

/* Card Styling (Matches About Page) */
.purchase-card {
  background: #13171d;
  border: 1px solid rgba(0, 255, 200, 0.12);
  border-radius: 14px;
  box-shadow: 0 0 20px rgba(0, 255, 200, 0.05);
  transition: 0.3s ease;
}
.purchase-card:hover {
  background: #1a1f26;
}

.text-muted {
  color: #cfd3d7 !important;
  font-weight: 600;
}


/* Button Styling */
.btn-primary {
  background: #00e6b8;
  color: #000;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  transition: 0.3s ease;
}
.btn-primary:hover {
  background: #00caa3;
  color: #fff;
}

/* Form text */
.form-fields p label {
  color: #bfc6cf;
  font-weight: 500;
}
.form-fields input,
.form-fields select,
.form-fields textarea {
  background: #0f141a;
  border: 1px solid rgba(255,255,255,0.1);
  color: #e4e4e4;
  border-radius: 6px;
}

/* Mobile Responsive */
@media (max-width: 767px) {
  .bike-title {
    font-size: 1.6rem;
  }
  .purchase-card {
    padding: 20px;
  }
  .bike-image {
    max-height: 260px;
    object-fit: cover;
  }
}
</style>

{% endblock %}
