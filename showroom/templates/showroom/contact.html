{% extends 'showroom/base.html' %}
{% block content %}

<section class="contact-premium py-5">
  <div class="container">

    <!-- Title -->
    <h2 class="text-center fw-bold mb-2 text-light">Contact BikeBuddy EV </h2>
    <p class="text-center text-secondary mb-5">
      Have questions? We are here to assist you.
    </p>

    <div class="row g-4">

      <!-- Contact Form -->
      <div class="col-lg-6">
        <div class="premium-card p-4">

          <form method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-semibold">Full Name</label>
              {{ form.name }}
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              {{ form.email }}
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Subject</label>
              {{ form.subject }}
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Message</label>
              {{ form.message }}
            </div>

            <button class="btn-premium w-100">Send Message</button>
          </form>

        <!-- Social Media Section -->
<div class="social-section text-center mt-5">
  <h5 class="text-light fw-semibold mb-3">Connect With Us</h5>

  <div class="d-flex justify-content-center gap-3">

    

    <!-- Instagram -->
    <a href="https://www.instagram.com/its_prithvi_banna_/?igsh=cTRuanY1cm5oMTk%3D&utm_source=ig_contact_invite#" target="_blank" class="social-icon">
      <i class="bi bi-instagram"></i>
    </a>

    
    <!-- github -->
    <a href="https://github.com/Singh-prithviraj " target="_blank" class="social-icon">
      <i class="bi bi-github"></i>
    </a>


    <!-- WhatsApp -->
    <a href="https://wa.me/916267174657" target="_blank" class="social-icon">
      <i class="bi bi-whatsapp"></i>
    </a>

    <!-- linkedin -->
    <a href="https://linkedin.com/in/prithviraj-singh-chouhan-b415a2319/" target="_blank" class="social-icon">
      <i class="bi bi-linkedin"></i>
    </a>



    

  </div>
</div>

    <!-- Floating Contact Sidebar -->
    <div class="floating-contact">
        <a href="https://wa.me/919876543210" target="_blank" class="contact-icon whatsapp">
            <i class="fa-brands fa-whatsapp"></i>
        </a>

        <a href="tel:+919876543210" class="contact-icon phone">
            <i class="fa-solid fa-phone"></i>
        </a>

        <a href="mailto:youremail@example.com" class="contact-icon email">
            <i class="fa-solid fa-envelope"></i>
        </a>

        <a href="https://instagram.com/yourprofile" target="_blank" class="contact-icon insta">
            <i class="fa-brands fa-instagram"></i>
        </a>
    </div>



        </div>
      </div>

      <!-- Map -->
      <div class="col-lg-6">
        <div class="premium-map">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d29284.54392725649!2d75.8625252848146!3d23.43996797302455!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sghonsla%20ujjain%20-%20agar%20road%20ghosla%20madhya%20pradesh!5e0!3m2!1sen!2sin!4v1761998725406!5m2!1sen!2sin"
            width="100%"
            height="450"
            style="border:0;"
            allowfullscreen=""
            loading="lazy">
          </iframe>
        </div>
      </div>

    </div>
  </div>
</section>


<style>

/* Soft Premium Dark Background */
.contact-premium {
  background: linear-gradient(145deg, #0e1117, #131821, #0b0e14);
  min-height: 100vh;
  color: #e5e7eb;
}

/* Card: clean luxury design */
.premium-card {
  background: #1b1f27;
  border-radius: 14px;
  border: 1px solid #2a2f3a;
  box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.35);
  transition: 0.3s ease;
}
.premium-card:hover {
  transform: translateY(-3px);
  box-shadow: 0px 10px 24px rgba(0, 0, 0, 0.45);
}

/* Map container */
.premium-map {
  background: #1b1f27;
  border-radius: 14px;
  border: 1px solid #2a2f3a;
  overflow: hidden;
  box-shadow: 0px 8px 20px rgba(0,0,0,0.35);
}

/* Labels */
label {
  color: #d1d5db !important;
  font-size: 0.95rem;
}

/* Inputs */
form input, form textarea, select {
  background: #232832 !important;
  border: 1px solid #363c49 !important;
  color: #e5e7eb !important;
  border-radius: 8px;
  padding: 10px;
}
form input:focus,
form textarea:focus {
  background: #1e222b !important;
  border-color: #4a84f1 !important;
  box-shadow: 0 0 0 3px rgba(74,132,241,0.2) !important;
}

/* Premium Button */
.btn-premium {
  padding: 12px;
  font-weight: 600;
  font-size: 1rem;
  border-radius: 8px;
  background: #3f73df;
  color: #fff;
  border: none;
  transition: 0.3s ease-in-out;
}
.btn-premium:hover {
  background: #315cc1;
}
.social-section h5 {
  color: #d1d5db;
}

.social-icon {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #1f242d;
  border: 1px solid #2a2f38;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  color: #cbd5e1;
  transition: .25s ease-in-out;
  text-decoration: none;
  box-shadow: 0px 4px 10px rgba(0,0,0,0.35);
}

.social-icon:hover {
  background: #2b313d;
  border-color: #4a84f1;
  color: #4a84f1;
  transform: translateY(-3px);
}


</style>

{% endblock %}
